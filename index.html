<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads Eventos | Legalnova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --lg-bg: #202020;
    --lg-bg-alt: #1a1a1a;
    --lg-surface: #1c1d20;
    --lg-border: #34353a;
    --lg-text: #a0a0a0;
    --lg-heading: #ffffff;
    --lg-accent: #08c486;
    --lg-accent-dark: #06a271;
    --font-heading: "Montserrat", "Open Sans", Arial, sans-serif;
    --font-body: "Open Sans", Arial, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--lg-bg);
    color: var(--lg-text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
  }

  a{ color: inherit; text-decoration: none; }

  img{ max-width: 100%; display: block; }

  h1, h2{ font-family: var(--font-heading); color: var(--lg-heading); }

  ::selection{ background: var(--lg-accent); color: #06110c; }

  /* ---------- Header ---------- */

  .site-header{
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--lg-bg);
    border-bottom: 1px solid var(--lg-border);
  }

  .header-inner{
    max-width: 1280px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .header-logo img{ width: 150px; height: auto; }

  /* main nav */

  .main-nav{
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .main-nav > ul{
    display: flex;
    align-items: center;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 4px;
  }

  .main-nav > ul > li{
    position: relative;
  }

  .main-nav > ul > li > a,
  .main-nav > ul > li > button.nav-toggle{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 500;
    color: var(--lg-heading);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .main-nav > ul > li > a:hover,
  .main-nav > ul > li > button.nav-toggle:hover{ color: var(--lg-accent); }

  .caret{
    width: 8px; height: 8px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg);
    margin-top: -3px;
    transition: transform .2s ease;
  }

  .has-dropdown:hover .caret,
  .has-dropdown.open .caret{ transform: rotate(-135deg); margin-top: 3px; }

  .dropdown{
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 220px;
    background: var(--lg-surface);
    border: 1px solid var(--lg-border);
    border-radius: 8px;
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 12px 30px rgba(0,0,0,.4);
  }

  .has-dropdown:hover .dropdown,
  .has-dropdown.open .dropdown{ display: flex; }

  .dropdown a{
    padding: 9px 12px;
    border-radius: 5px;
    font-size: 14px;
    color: var(--lg-text);
  }

  .dropdown a:hover{ background: rgba(8,196,134,.1); color: var(--lg-accent); }

  /* language switch */

  .lang-switch{ position: relative; }
  .lang-switch > button{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--lg-heading);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 10px 12px;
    font-family: var(--font-body);
  }
  .lang-flag{ font-size: 16px; line-height: 1; }

  /* client button */

  .btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 26px;
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font-body);
    color: var(--lg-heading);
    border: 1px solid var(--lg-border);
    border-radius: 5px;
    background: transparent;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color .3s ease, border-color .3s ease;
  }
  .btn::after{
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 0;
    background: var(--lg-accent);
    transition: height .3s ease;
    z-index: -1;
  }
  .btn:hover{ color: #0b0b0b; border-color: var(--lg-accent); }
  .btn:hover::after{ height: 100%; }

  .header-actions{
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* burger (mobile) */

  .burger{
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    flex-direction: column;
    gap: 5px;
  }
  .burger span{
    display: block;
    width: 24px;
    height: 2px;
    background: var(--lg-heading);
  }

  @media (max-width: 900px){
    .main-nav{ display: none; }
    .header-actions .lang-switch{ display: none; }
    .burger{ display: flex; }

    .main-nav.mobile-open{
      display: flex;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--lg-bg);
      border-bottom: 1px solid var(--lg-border);
      padding: 10px 24px 20px;
    }
    .main-nav.mobile-open > ul{
      flex-direction: column;
      align-items: stretch;
      width: 100%;
    }
    .main-nav.mobile-open .dropdown{
      position: static;
      display: none;
      border: none;
      box-shadow: none;
      background: transparent;
      padding-left: 10px;
      margin-top: 4px;
    }
    .main-nav.mobile-open .has-dropdown.open .dropdown{ display: flex; }
  }

  /* ---------- Main / form section ---------- */

  main{
    position: relative;
    max-width: 640px;
    margin: 0 auto;
    padding: 72px 24px 100px;
    overflow: hidden;
  }

  /* soft brand-green glow behind the card, like the accent dot in the logo */
  main::before{
    content: "";
    position: absolute;
    top: -120px;
    left: 50%;
    width: 620px;
    height: 420px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(8,196,134,.20), rgba(8,196,134,0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  main > *{ position: relative; z-index: 1; }

  .form-intro{ text-align: center; margin-bottom: 40px; }

  .intro-badge{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    margin-bottom: 18px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--lg-accent);
    background: rgba(8,196,134,.1);
    border: 1px solid rgba(8,196,134,.35);
    border-radius: 999px;
  }
  .intro-badge .dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--lg-accent);
    box-shadow: 0 0 8px rgba(8,196,134,.9);
  }

  .form-intro h1{
    font-size: 32px;
    line-height: 1.25;
    font-weight: 700;
    margin: 0 0 14px;
  }

  .form-intro h1 .accent{
    color: var(--lg-accent);
    position: relative;
  }
  .form-intro h1 .accent::after{
    content: "*";
    color: var(--lg-accent);
    margin-left: 2px;
  }

  .form-intro p{ margin: 0 auto; max-width: 420px; color: var(--lg-text); }

  #mc_embed_signup{
    position: relative;
    background: linear-gradient(180deg, var(--lg-surface), var(--lg-bg-alt));
    border: 1px solid var(--lg-border);
    border-radius: 18px;
    padding: 38px 34px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
    overflow: hidden;
  }

  /* accent bar across the top of the card */
  #mc_embed_signup::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--lg-accent), var(--lg-accent-dark), var(--lg-accent));
  }

  .form-icon{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    margin-bottom: 16px;
    border-radius: 12px;
    background: rgba(8,196,134,.12);
    border: 1px solid rgba(8,196,134,.3);
    color: var(--lg-accent);
    font-size: 20px;
  }

  #mc_embed_signup h2{
    font-size: 21px;
    margin: 0 0 6px;
  }

  #mc_embed_signup .indicates-required{
    font-size: 12px;
    color: var(--lg-text);
    margin-bottom: 26px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--lg-border);
  }

  #mc_embed_signup .asterisk{ color: var(--lg-accent); }

  .mc-field-group{ margin-bottom: 18px; }

  .mc-field-group label{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--lg-heading);
    margin-bottom: 7px;
  }

  .mc-field-group .field-wrap{ position: relative; }

  .mc-field-group .field-wrap svg{
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    stroke: #6b6b6b;
    pointer-events: none;
    transition: stroke .2s ease;
  }

  .mc-field-group input{
    width: 100%;
    padding: 13px 14px 13px 40px;
    background: var(--lg-bg);
    border: 1px solid var(--lg-border);
    border-radius: 8px;
    color: var(--lg-heading);
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }

  .mc-field-group input::placeholder{ color: #6b6b6b; }

  .mc-field-group input:focus{
    border-color: var(--lg-accent);
    background: #16171a;
    box-shadow: 0 0 0 4px rgba(8,196,134,.15);
  }

  .field-wrap:focus-within svg{ stroke: var(--lg-accent); }

  #mce-responses{ margin: 4px 0; }
  #mce-error-response{
    color: #ff6b6b;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    background: rgba(255,107,107,.1);
    border: 1px solid rgba(255,107,107,.25);
  }
  #mce-success-response{
    color: var(--lg-accent);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    background: rgba(8,196,134,.1);
    border: 1px solid rgba(8,196,134,.25);
  }

  .clear{ clear: both; }

  #mc-embedded-subscribe{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 8px;
    padding: 15px 20px;
    font-size: 15px;
    font-weight: 700;
    font-family: var(--font-body);
    letter-spacing: .01em;
    color: #06110c;
    background: linear-gradient(135deg, var(--lg-accent), var(--lg-accent-dark));
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 12px 24px -8px rgba(8,196,134,.55);
    transition: transform .15s ease, box-shadow .15s ease, background .2s ease;
  }
  #mc-embedded-subscribe:hover{
    transform: translateY(-2px);
    box-shadow: 0 16px 30px -8px rgba(8,196,134,.7);
  }
  #mc-embedded-subscribe:active{ transform: translateY(0); }

  .form-footnote{
    text-align: center;
    font-size: 12px;
    color: #6b6b6b;
    margin-top: 16px;
  }

  footer{
    text-align: center;
    padding: 30px 24px 50px;
    font-size: 12px;
    color: #5c5c5c;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="https://legalnova.co" aria-label="Legalnova">
      <img src="https://legalnova.co/wp-content/uploads/2025/11/Logo-legalnova.svg" alt="Logo legalnova" width="150" height="41">
    </a>

    <div class="header-actions">
      <div class="lang-switch">
        <button type="button" aria-haspopup="true">
          <span class="lang-flag">🇺🇸</span> EN
        </button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="form-intro">
    <span class="intro-badge"><span class="dot"></span> Legalnova Eventos</span>
    <h1><span class="accent">Hey!</span> Nos alegra que estés aquí</h1>
    <p>Completa el formulario y nos pondremos en contacto contigo.</p>
  </div>

  <div id="mc_embed_signup">
    <form action="https://legalnova.us22.list-manage.com/subscribe/post?u=84f2c4798081c56bcbc35077f&amp;id=4c7c4367e0&amp;f_id=00b2dde1f0"
          method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_blank">
      <div id="mc_embed_signup_scroll">
        <span class="form-icon" aria-hidden="true">✦</span>
        <h2>Leads Eventos</h2>
        <div class="indicates-required"><span class="asterisk">*</span> indica campo obligatorio</div>

        <div class="mc-field-group">
          <label for="mce-EMAIL">Correo electrónico <span class="asterisk">*</span></label>
          <div class="field-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5 12 13l9-6.5"/><rect x="3" y="4.5" width="18" height="15" rx="2.5"/></svg>
            <input type="email" name="EMAIL" class="required email" id="mce-EMAIL" autocomplete="email" placeholder="tucorreo@empresa.com" required>
          </div>
        </div>

        <div class="mc-field-group">
          <label for="mce-FNAME">Nombre <span class="asterisk">*</span></label>
          <div class="field-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-4 4-6 7.5-6s6.1 2 7.5 6"/></svg>
            <input type="text" name="FNAME" class="required text" id="mce-FNAME" autocomplete="name" placeholder="Tu nombre" required>
          </div>
        </div>

        <div class="mc-field-group">
          <label for="mce-LNAME">Evento <span class="asterisk">*</span></label>
          <div class="field-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/></svg>
            <input type="text" name="LNAME" class="required text" id="mce-LNAME" placeholder="¿A qué evento vienes?" required>
          </div>
        </div>

        <div class="mc-field-group">
          <label for="mce-PHONE">Teléfono <span class="asterisk">*</span></label>
          <div class="field-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h3.2l1.3 4.3-2 1.6a12 12 0 0 0 6.1 6.1l1.6-2 4.3 1.3V19a1.5 1.5 0 0 1-1.6 1.5A15.5 15.5 0 0 1 3.5 6.1 1.5 1.5 0 0 1 5 4.5Z"/></svg>
            <input type="tel" name="PHONE" class="REQ_CSS" id="mce-PHONE" autocomplete="tel" inputmode="tel" placeholder="+57 300 000 0000">
          </div>
        </div>

        <div hidden>
          <input type="hidden" name="tags" value="28392,27455">
        </div>

        <div id="mce-responses" class="clear">
          <div class="response" id="mce-error-response" style="display:none;"></div>
          <div class="response" id="mce-success-response" style="display:none;"></div>
        </div>

        <!-- honeypot anti-bot field required by Mailchimp -->
        <div aria-hidden="true" style="position:absolute; left:-5000px;">
          <input type="text" name="b_84f2c4798081c56bcbc35077f_4c7c4367e0" tabindex="-1" value="">
        </div>

        <div class="clear">
          <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button" value="Enviar">
        </div>

        <p class="form-footnote">Tus datos están protegidos y solo se usarán para este evento.</p>
      </div>
    </form>
  </div>
</main>

<footer>© Legalnova. Todos los derechos reservados.</footer>

<script>
  // Native HTML5 "required" validation is used instead of Mailchimp's
  // jQuery-based mc-validate.js (dropped — avoids pulling in jQuery
  // just for pre-submit validation that the browser already does).
  // The form still posts straight to Mailchimp's list-manage endpoint.
</script>

</body>
</html>
